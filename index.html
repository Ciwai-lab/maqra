<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Maqra – Penjaga Waktu</title>
    <meta name="description"
        content="Maqra – penjaga ritme harian muslim. Jadwal sholat, imsyak, dan live Masjidil Haram." />

    <link rel="icon" type="image/png" href="assets/images/favicon.png" />
    <link rel="stylesheet" href="css/style.css" />

    <!-- OG -->
    <meta property="og:title" content="Maqra CiwAI" />
    <meta property="og:description"
        content="Maqra – penjaga ritme harian muslim. Jadwal sholat, imsyak, dan live Masjidil Haram." />
    <meta property="og:url" content="https://maqra.ciwai.dev/" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://ciwai.dev/assets/images/logo_ai.webp" />
</head>

<body>

    <main class="container">

        <header class="header">
            <h1>Maqra</h1>
            <p class="subtitle">Penjaga ritme harian</p>
        </header>

        <!-- Lokasi -->
        <section class="location">
            <label for="city">Lokasi</label>
            <select id="city">

                <!-- Banten -->
                <option value="Serang">Serang</option>
                <option value="Pandeglang">Pandeglang</option>
                <option value="Cilegon">Cilegon</option>
                <option value="Lebak">Lebak</option>
                <option value="Tangerang">Tangerang</option>
                <option value="Tangerang Selatan">Tangerang Selatan</option>

                <!-- Jawa -->
                <option value="Jakarta">Jakarta</option>
                <option value="Bogor">Bogor</option>
                <option value="Depok">Depok</option>
                <option value="Tangerang">Tangerang</option>
                <option value="Bekasi">Bekasi</option>
                <option value="Bandung">Bandung</option>
                <option value="Cirebon">Cirebon</option>
                <option value="Semarang">Semarang</option>
                <option value="Yogyakarta">Yogyakarta</option>
                <option value="Surabaya">Surabaya</option>
                <option value="Malang">Malang</option>

                <!-- Sumatra -->
                <option value="Medan">Medan</option>
                <option value="Padang">Padang</option>
                <option value="Pekanbaru">Pekanbaru</option>
                <option value="Palembang">Palembang</option>
                <option value="Bandar Lampung">Bandar Lampung</option>

                <!-- Kalimantan -->
                <option value="Pontianak">Pontianak</option>
                <option value="Palangkaraya">Palangkaraya</option>
                <option value="Banjarmasin">Banjarmasin</option>
                <option value="Balikpapan">Balikpapan</option>
                <option value="Samarinda">Samarinda</option>

                <!-- Sulawesi -->
                <option value="Makassar">Makassar</option>
                <option value="Manado">Manado</option>
                <option value="Palu">Palu</option>
                <option value="Kendari">Kendari</option>

                <!-- Bali & Nusa Tenggara -->
                <option value="Denpasar">Denpasar</option>
                <option value="Mataram">Mataram</option>
                <option value="Kupang">Kupang</option>

                <!-- Maluku & Papua -->
                <option value="Ambon">Ambon</option>
                <option value="Ternate">Ternate</option>
                <option value="Jayapura">Jayapura</option>
            </select>
        </section>

        <!-- Jadwal Sholat -->
        <section class="prayer-times">
            <div class="time imsak">
                <span>Imsyak</span>
                <strong id="imsyak">--:--</strong>
            </div>

            <div class="time"><span>Subuh</span><strong id="subuh">--:--</strong></div>
            <div class="time"><span>Dzuhur</span><strong id="dzuhur">--:--</strong></div>
            <div class="time"><span>Ashar</span><strong id="ashar">--:--</strong></div>
            <div class="time"><span>Maghrib</span><strong id="maghrib">--:--</strong></div>
            <div class="time"><span>Isya</span><strong id="isya">--:--</strong></div>
        </section>

        <!-- Countdown -->
        <section class="countdown">
            <p>Menuju sholat berikutnya</p>
            <h2 id="countdown">--:--:--</h2>
            <p id="nextPrayer" class="next-prayer"></p>
        </section>

        <!-- Live Masjidil Haram -->
        <section class="live">
            <button id="toggleLive">Lihat kondisi Masjidil Haram (Live)</button>

            <div id="liveContainer" class="hidden"></div>
        </section>

        <footer class="footer">
            <p>maqra.ciwai.dev</p>
        </footer>

    </main>

    <script src="js/app.js"></script>
</body>

</html>
