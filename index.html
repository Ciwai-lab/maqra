<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>MaQra – Penjaga Waktu</title>
    <meta name="description"
        content="MaQra – penjaga ritme harian muslim. Jadwal sholat, imsyak, dan live Masjidil Haram." />

    <link rel="icon" type="image/png" href="/assets/favicon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css" />

    <!-- OG -->
    <meta property="og:title" content="Maqra CiwAI" />
    <meta property="og:description"
        content="MaQra – penjaga ritme harian muslim. Jadwal sholat, imsyak, dan live Masjidil Haram." />
    <meta property="og:url" content="https://maqra.ciwai.dev/" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://ciwai.dev/assets/logo_ai.webp" />
</head>

<body>

    <main class="container">

        <header class="header">
            <h1>MaQra</h1>
            <p class="subtitle">Penjaga ritme harian</p>
            <div id="realtime-clock"
                style="font-size: 1.5rem; font-weight: 700; margin-top: 10px; color: var(--accent);">00:00:00</div>
        </header>

        <!-- Lokasi -->
        <section class="location">
            <label for="city">Lokasi</label>
            <select id="city">
                <option value="2445">Serang</option>
                <option value="2440">Pandeglang</option>
                <option value="2438">Cilegon</option>
                <option value="2439">Lebak</option>
                <option value="2446">Tangerang</option>
                <option value="2447">Tangerang Selatan</option>
                <option value="1301">Jakarta</option>
                <option value="1205">Bogor</option>
                <option value="1211">Depok</option>
                <option value="1203">Bekasi</option>
                <option value="1210">Bandung</option>
                <option value="1213">Cirebon</option>
                <option value="1411">Semarang</option>
                <option value="1432">Yogyakarta</option>
                <option value="1638">Surabaya</option>
                <option value="1618">Malang</option>
                <option value="0228">Medan</option>
                <option value="0315">Padang</option>
                <option value="0410">Pekanbaru</option>
                <option value="0621">Palembang</option>
                <option value="0816">Bandar Lampung</option>
                <option value="1812">Pontianak</option>
                <option value="1909">Palangkaraya</option>
                <option value="2005">Banjarmasin</option>
                <option value="2102">Balikpapan</option>
                <option value="2108">Samarinda</option>
                <option value="2716">Makassar</option>
                <option value="2510">Manado</option>
                <option value="2609">Palu</option>
                <option value="2805">Kendari</option>
                <option value="2201">Denpasar</option>
                <option value="2304">Mataram</option>
                <option value="2314">Kupang</option>
                <option value="2901">Ambon</option>
                <option value="3111">Ternate</option>
                <option value="3211">Jayapura</option>
            </select>
        </section>

        <!-- Jadwal Sholat -->
        <section class="prayer-times">
            <div class="time imsak">
                <span>Imsyak</span>
                <strong id="imsyak">--:--</strong>
            </div>

            <div class="time"><span>Subuh</span><strong id="subuh">--:--</strong></div>
            <div class="time"><span>Dzuhur</span><strong id="dzuhur">--:--</strong></div>
            <div class="time"><span>Ashar</span><strong id="ashar">--:--</strong></div>
            <div class="time"><span>Maghrib</span><strong id="maghrib">--:--</strong></div>
            <div class="time"><span>Isya</span><strong id="isya">--:--</strong></div>
        </section>

        <!-- Countdown -->
        <section class="countdown">
            <p>Menuju sholat berikutnya</p>
            <h2 id="countdown">--:--:--</h2>
            <p id="nextPrayer" class="next-prayer"></p>
            <div class="progress-container">
                <div id="progress-bar" class="progress-bar"></div>
            </div>
        </section>

        <!-- Live Masjidil Haram -->
        <section class="live">
            <button id="toggleLive">Lihat kondisi Masjidil Haram (Live)</button>

            <div id="liveContainer" class="hidden"></div>
        </section>

        <footer class="footer">
            <p>maqra.ciwai.dev</p>
        </footer>

    </main>

    <script src="js/app.js"></script>
</body>

</html>
